# A feed, served from the checkout so the run needs no network and no live
# source. 150 usable prefixes plus four lines the sanitiser must drop (two
# private ranges, 0.0.0.0/0, and a line that is not an address at all).
POLICY_stream_FEED="file:///work/test/fixtures/policy-feed.list"
POLICY_stream_FEED_MIN="100"
# An exclusion: address space the rule may never claim. It overlaps the feed
# and the static seeds on purpose, so the run can prove the negative match
# beats both, and the list carries a private range the sanitiser must drop.
POLICY_stream_EXCLUDE_FEED="file:///work/test/fixtures/policy-exclude.list"
POLICY_stream_EXCLUDE_CIDRS="192.0.2.0/24"
POLICY_FEED_SCHEDULE="daily"

DNS_STACK="yes"
DNS_FILTER_ENABLE="no"
DNS_EGRESS="main"
DNSCRYPT_RESOLVERS="google"
DNS_FALLBACK="8.8.8.8"
# Host config the kit does not own, carried into the snapshot but never
# restored. /etc/hostname exists everywhere and is the cheapest thing to prove
# the extra/ path with.
BACKUP_EXTRA="/etc/hostname"
SSH_PORT="22"
IPV6_HARDEN="no"
